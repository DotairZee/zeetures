name: build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

env:
  CTEST_OUTPUT_ON_FAILURE: TRUE
  # GitHub runners have two cores each
  MAKEFLAGS: -j3 -k
  # set some variables for Visual Studio
  MultiProcessorCompilation: true
  UseMultiToolTask: true
  EnforceProcessCountAcrossBuilds: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: "Check out source"
      uses: actions/checkout@v3
    - name: "Install clang-format"
      run: |
        wget https://github.com/muttleyxd/clang-tools-static-binaries/releases/download/master-2da3e7b/clang-format-11_linux-amd64
        chmod +x clang-format-11_linux-amd64
        mv clang-format-11_linux-amd64 /usr/local/bin/clang-format
    - name: "clang-format"
      run: ./scripts/lint.py -v 0000000 # diff from null sha is every file

  # CHANGELOG.md is generated from the commit history; this fails when a
  # push did not regenerate it (python3 .github/changelog.py --write)
  changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: "CHANGELOG.md up to date"
      run: python3 .github/changelog.py --check

  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest,ubuntu-26.04,macos-latest]
    steps:
    - name: "Check out source"
      uses: actions/checkout@v3
    - name: "Install dependencies (Ubuntu)"
      if: "startsWith(matrix.os, 'ubuntu-')"
      run: sudo apt-get update && sudo apt-get install libpng-dev zlib1g-dev libsdl3-dev
    - name: "Configure"
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: "Build"
      run: cmake --build build --config RelWithDebInfo
    - name: "Test"
      run: cd build && ctest --build-config RelWithDebInfo
    - name: "Create distribution artifact"
      if: runner.os == 'Windows'
      run: cmake --install build --config RelWithDebInfo --prefix "openc2e-${{ github.sha }}-${{ runner.os }}"
    - name: "Create distribution artifact"
      if: runner.os == 'Windows'
      run: cmake --install build --config RelWithDebInfo --prefix "mngplayer2-${{ github.sha }}-${{ runner.os }}" --component mngplayer2
    - name: "Upload distribution artifact"
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: openc2e-${{ github.sha }}-${{ runner.os }}
        path: openc2e-${{ github.sha }}-${{ runner.os }}
    - name: "Upload distribution artifact"
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: MNGPlayer2-${{ github.sha }}-${{ runner.os }}
        path: mngplayer2-${{ github.sha }}-${{ runner.os }}

  # 32-bit builds (this fork, 2026-11-15): upstream builds only 64-bit, so
  # these catch code that assumes 64-bit pointers or longs
  build-32bit:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-win32
            os: windows-latest
            configure: -A Win32
          - name: linux-i386
            os: ubuntu-26.04
            # (SDL built for X11 only, without Wayland: fewer 32-bit packages)
            configure: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_LIBRARY_ARCHITECTURE=i386-linux-gnu -DOPENC2E_BUNDLED_SDL=ON -DOPENC2E_ASAN=OFF -DSDL_WAYLAND=OFF
    steps:
    - name: "Check out source"
      uses: actions/checkout@v3
    - name: "Install dependencies (Linux i386)"
      if: runner.os == 'Linux'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install gcc-multilib g++-multilib zlib1g-dev:i386 libpng-dev:i386 libx11-dev:i386 libxext-dev:i386 libxcursor-dev:i386 libxrandr-dev:i386 libxi-dev:i386 libxss-dev:i386 libxtst-dev:i386 libxfixes-dev:i386 libxkbcommon-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386 libasound2-dev:i386 libpulse-dev:i386
        # (pkg-config to find the 32-bit libraries)
        echo "PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
    - name: "Configure"
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{ matrix.configure }}
    - name: "Build"
      run: cmake --build build --config RelWithDebInfo
    - name: "Test"
      run: cd build && ctest --build-config RelWithDebInfo
